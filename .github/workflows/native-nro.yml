name: Build NXSand.nro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: CPU unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev xvfb

      - name: Build and run unit tests
        run: make test

      - name: Build and run GPU unit tests
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: make test-gpu

  switch:
    name: Switch NRO
    needs: unit-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required portlibs
        run: dkp-pacman -Q switch-sdl2 switch-mesa switch-glm switch-freetype switch-harfbuzz

      - name: Build NRO and stage dist
        run: |
          make
          make dist

      - name: Package switch zip
        run: python3 -c "import shutil; shutil.make_archive('NXSand-switch', 'zip', 'dist', 'switch')"

      - uses: actions/upload-artifact@v4
        with:
          name: NXSand-switch
          path: NXSand-switch.zip
          if-no-files-found: error

      - name: Install hint
        if: success()
        run: |
          echo "Artifact: NXSand-switch.zip (switch/NXSand.nro inside)"
          echo "Install: unzip at SD card root, or copy to sdmc:/switch/NXSand.nro"
          echo "See docs/INSTALL.md"

  desktop:
    name: Desktop sanity build (Linux)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 + GLESv2 + FreeType (Mesa)
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev libfreetype6-dev xvfb curl

      - name: Fetch UI font
        run: |
          mkdir -p romfs/fonts
          curl -fsSL -o romfs/fonts/NotoSans-Regular.ttf \
            https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf
          test -s romfs/fonts/NotoSans-Regular.ttf

      - name: Build desktop
        run: make desktop

      - name: GPU unit tests
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: make test-gpu

      - name: Verify binary
        run: test -f build/NXSand
