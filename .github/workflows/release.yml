name: Release NXSand

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.0.1)
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        required: false
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  unit-tests:
    name: CPU unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build and run unit tests
        run: make test

  build-switch:
    name: Package Switch NRO
    needs: unit-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required portlibs
        run: dkp-pacman -Q switch-sdl2 switch-mesa switch-glm switch-freetype switch-harfbuzz

      - name: Build NRO
        run: make

      - name: Export NSP forwarder
        env:
          SWITCH_PROD_KEYS: ${{ secrets.SWITCH_PROD_KEYS }}
        run: |
          python3 -m pip install --quiet nton
          python3 scripts/export-nsp.py --skip-if-no-keys

      - name: Package Switch zip
        run: python3 scripts/package-release.py switch --tag "${{ env.RELEASE_TAG }}"

      - uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: release-switch
          path: dist/release/NXSand-switch-v*.zip
          if-no-files-found: error

  build-linux:
    name: Package Linux portable
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 + GLESv2 + FreeType (Mesa)
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev libfreetype6-dev curl

      - name: Fetch UI font
        run: |
          mkdir -p romfs/fonts
          curl -fsSL -o romfs/fonts/NotoSans-Regular.ttf \
            https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf
          test -s romfs/fonts/NotoSans-Regular.ttf

      - name: Build desktop
        run: make desktop

      - name: Package Linux zip
        run: python3 scripts/package-release.py linux --tag "${{ env.RELEASE_TAG }}"

      - uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: release-linux
          path: dist/release/NXSand-linux-v*.zip
          if-no-files-found: error

  build-windows:
    name: Package Windows portable
    needs: unit-tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-angleproject

      - name: Fetch UI font
        shell: pwsh
        run: ./scripts/fetch-font.ps1

      - name: Build desktop
        run: bash scripts/build-desktop-msys.sh

      - name: Package Windows zip
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          export MINGW_PREFIX="/mingw64"
          python3 scripts/package-release.py windows --tag "${{ env.RELEASE_TAG }}"

      - uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: release-windows
          path: dist/release/NXSand-windows-v*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-switch, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: ${{ env.ACT != 'true' }}
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true

      - name: List release artifacts
        if: ${{ env.ACT != 'true' }}
        run: ls -la dist/release/

      - name: Skip publish under act
        if: env.ACT == 'true'
        run: echo "act local run — publish skipped"

      - name: Publish GitHub release
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: NXSand ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: dist/release/*.zip
          generate_release_notes: true
          replace_existing_assets: true
