<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">Lava + water quench (NXSand sim.frag)</title>
  <desc id="desc">Active lava above water becomes smoke and turns the water into stone.</desc>
  <style>
    text{font-family:Arial,sans-serif;font-size:14px;fill:#17202a}
    .title{font-size:18px;font-weight:700}
    .box{fill:#f7fbff;stroke:#5b7890;stroke-width:1.5;rx:8}
    .yes{fill:#e9f7ef;stroke:#2e7d32}
    .no{fill:#fff8e1;stroke:#9a6a00}
    .arrow{stroke:#3b4a54;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3b4a54"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Lava + water quench (NXSand sim.frag)</text>
  <rect class="box" x="190" y="58" width="180" height="44"/>
  <text x="226" y="85">Active lava cell L</text>
  <path class="arrow" d="M280 102 V132"/>
  <rect class="box" x="160" y="132" width="240" height="44"/>
  <text x="188" y="159">Cell below L is water W?</text>
  <path class="arrow" d="M210 176 C120 198 110 214 110 232"/>
  <path class="arrow" d="M350 176 C440 198 450 214 450 232"/>
  <text x="128" y="205">yes</text>
  <text x="418" y="205">no</text>
  <rect class="box yes" x="38" y="224" width="180" height="44"/>
  <text x="58" y="250">L -> smoke, W -> stone</text>
  <rect class="box no" x="342" y="224" width="180" height="44"/>
  <text x="374" y="250">Normal lava flow</text>
</svg>
