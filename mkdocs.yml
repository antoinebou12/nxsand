# NXSand documentation site (Material for MkDocs, IPC Toolkit–style layout)
# Local: pip install -r requirements-docs.txt && mkdocs serve
# Publish: push to main (docs workflow) or mkdocs gh-deploy

site_name: NXSand
site_description: GPU falling-sand sandbox for Nintendo Switch homebrew and desktop dev builds.
site_url: https://antoinebou12.github.io/nxsand/
repo_url: https://github.com/antoinebou12/nxsand
repo_name: antoinebou12/nxsand
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

validation:
  omitted_files: warn
  unrecognized_links: ignore
  absolute_links: ignore

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Install on Switch: INSTALL.md
      - Controls: CONTROLS.md
      - Settings & saves: SETTINGS.md
  - Physics & materials: PHYSICS.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Diagram catalog: DIAGRAMS.md
      - Diagram assets: diagrams/README.md
      - Native build: NATIVE.md
      - Development: DEVELOPMENT.md
      - Agent plans & Context7: AGENT_PLANS.md
  - Advanced:
      - TPT stamp import: TPT_IMPORT.md
      - Switch performance: SWITCH_PERF_MATRIX.md
      - CI & releases: CI.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antoinebou12/nxsand
    - icon: fontawesome/solid/download
      link: https://github.com/antoinebou12/nxsand/releases

copyright: Copyright &copy; NXSand contributors — MIT License
